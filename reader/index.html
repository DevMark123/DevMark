<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1e7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="书房" />
    <link rel="manifest" href="./manifest.webmanifest?v=2" />
    <link rel="icon" href="./apple-touch-icon-v9.png" sizes="180x180" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-v9.png" sizes="180x180" />
    <link rel="apple-touch-icon-precomposed" href="./apple-touch-icon-v9.png" />
    <title>书房</title>
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <main id="app-view" class="app-view">
      <section id="shelf-view" class="shelf-view">
        <header class="shelf-header">
          <div class="wordmark"><span class="tiny-mark">⌁</span> 书房</div>
          <div class="shelf-actions">
            <label class="import-button" for="book-import">导入 TXT<input id="book-import" type="file" accept=".txt,text/plain" /></label>
          </div>
        </header>
        <section class="shelf-hero">
          <div>
            <p class="eyebrow">MY LIBRARY</p>
            <h2>下午好，慢慢读。</h2>
            <p>书籍、进度与设置只保存在这台设备，断网也能阅读。</p>
          </div>
          <div id="library-count" class="library-count" aria-label="书籍数量"></div>
        </section>
        <section class="library-section" aria-labelledby="library-title">
          <div class="section-heading"><h3 id="library-title">书架</h3><span id="import-message" class="import-message" role="status"></span></div>
          <div id="book-list" class="book-list"></div>
        </section>
      </section>

      <section id="reader-view" class="reader-view hidden" aria-live="polite">
        <header class="reader-header">
          <button id="back-to-shelf" class="icon-button" aria-label="返回书架">←</button>
          <div class="reader-heading"><strong id="reader-book-title"></strong><span id="reader-chapter-title"></span></div>
          <span class="reader-header-spacer" aria-hidden="true"></span>
        </header>
        <aside id="toc-panel" class="toc-panel hidden" aria-label="目录">
          <div class="panel-heading"><strong>目录</strong><button id="close-toc" class="text-button">关闭</button></div>
          <div id="toc-list" class="toc-list"></div>
        </aside>
        <article id="reading-page" class="reading-page" tabindex="0" aria-label="阅读正文">
          <p id="page-text"></p>
        </article>
        <footer class="reader-footer">
          <div class="reader-reading-status" aria-live="off"><span id="reader-current-time"></span><span id="reader-page-status">本章 0 / 0 页</span></div>
          <div class="reader-footer-controls">
            <div class="chapter-navigation">
              <button id="previous-chapter" class="chapter-control" aria-label="上一章">上一章</button>
              <div class="progress-wrap">
                <input id="chapter-progress" class="chapter-progress" type="range" min="0" max="1" value="0" step="1" aria-label="本章阅读进度" />
                <span id="progress-text">本章 1 / 1 页 · 全书 0%</span>
              </div>
              <button id="next-chapter" class="chapter-control" aria-label="下一章">下一章</button>
            </div>
            <div class="reader-tools">
              <button id="toc-button" class="reader-tool" aria-label="章节选择">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" /></svg>
                <span>章节选择</span>
              </button>
              <button id="settings-button" class="reader-tool" aria-label="阅读设置">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6m4 0h6M4 17h10m4 0h2M10 4v6m4 4v6" /></svg>
                <span>设置</span>
              </button>
            </div>
          </div>
        </footer>
        <section id="settings-panel" class="settings-panel hidden" aria-label="阅读设置">
          <div class="sheet-handle"></div>
          <div class="settings-title-row"><h3>阅读设置</h3><button id="close-settings" class="text-button">完成</button></div>
          <p class="setting-label">字体粗细</p>
          <div class="option-row weight-row">
            <button data-weight="300">偏细</button><button data-weight="400" class="selected">标准</button><button data-weight="600">加粗</button>
          </div>
          <p class="setting-label">字号</p>
          <div class="size-control"><button id="decrease-font" aria-label="减小字号">−</button><span id="font-size-label">21</span><button id="increase-font" aria-label="增大字号">＋</button></div>
          <p class="setting-label">行距</p>
          <div class="option-row"><button data-line="1.7">紧凑</button><button data-line="1.95" class="selected">舒展</button><button data-line="2.2">宽松</button></div>
          <p class="setting-label">背景</p>
          <div class="theme-row"><button data-theme="paper" class="theme-dot paper selected" aria-label="纸白"></button><button data-theme="sepia" class="theme-dot sepia" aria-label="暖米色"></button><button data-theme="night" class="theme-dot night" aria-label="夜间"></button></div>
        </section>
      </section>
    </main>
    <script type="module" src="./app.js?v=7"></script>
  </body>
</html>
